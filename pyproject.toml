[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ak-md2anki"
version = "0.1.0"
description = "Compile structured Markdown (terminology tables, Q&A blocks) into Anki decks, with optional AI enrichment via OpenRouter."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andrey Kamensky" }]
requires-python = ">=3.10"
keywords = ["anki", "markdown", "spaced-repetition", "flashcards", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
]
dependencies = [
    "genanki>=0.13",
    "markdown>=3.6",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
]

[project.scripts]
ak-md2anki = "ak_md2anki.cli:main"

[project.urls]
"Homepage" = "https://github.com/andrey-kamensky/ak-md2anki"

[tool.setuptools.packages.find]
include = ["ak_md2anki*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter; keep readability

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
